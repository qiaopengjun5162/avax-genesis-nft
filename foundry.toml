[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false

# ---- 测试配置 ----
[profile.default.fuzz]
runs = 256

# ---- Avalanche Fuji ----
[rpc_endpoints]
avalancheFuji = "https://api.avax-test.network/ext/bc/C/rpc"

[etherscan]
avalancheFuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
