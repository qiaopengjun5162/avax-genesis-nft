name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 三个并行 job：合约 / 后端 / 前端
# 合约与后端各自独立验证；前端做 test + type-check + eslint + **生产构建**
# （tsc 只能验类型，验不到 client/server 边界、预渲染与字体加载）

jobs:
  contracts:
    name: Foundry (forge build / lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      # gen-abi.sh 用 node 做 JSON 压缩，显式装一下，别依赖 runner 预装版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: forge build
      - name: ABI 漂移检查（前端 lib/genesisMintAbi.json 必须与编译产物一致）
        # 前端 ABI 是编译产物快照。不同步的话，合约新增的 error/function 前端
        # 读不到——曾出现「ABI 停在 v1、缺 SignatureAlreadyUsed」，表现为 mint
        # 报一个无法解读的错误。这里重新生成再比对，改了合约忘了同步就直接红。
        run: |
          bash script/gen-abi.sh
          git diff --exit-code frontend/lib/genesisMintAbi.json \
            || { echo "❌ 前端 ABI 与合约不一致，请跑 bash script/gen-abi.sh 并提交 diff"; exit 1; }
      - name: Lint
        run: forge lint
      - name: Test
        run: forge test --force

  backend:
    name: Backend (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        # 不需要真实 RPC：单元测试用 fixture 私钥自签自查，
        # 不打链；缺少 .env 时 loadEnv() 静默返回空 → 启动期 check
        # 改条件启用。CI 这层不验证"链上 signer 自检"。
        env:
          # 提供一个测试私钥，让启动逻辑通过 SIGNER_PRIVATE_KEY 必填检查。
          # 它只用于 npm test，不用于任何外部访问。
          SIGNER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
          PORT: "8787"
        run: npm test
      - name: 冒烟（真实进程 + 真实 HTTP 栈）
        working-directory: backend
        # 单测用的是 mock req/res，验不到 listen / 端口冲突 / 413 之后排空 body /
        # keep-alive 这些只在真实 HTTP 栈上出现的行为。这里起真进程、打真请求，
        # 13 项断言里包含「响应到底能不能送回客户端」（413 若被掐连接，单测永远绿）。
        # 脚本自带端口预检，确保断言打在**本进程**而不是残留实例上。
        # 不设 SMOKE_SIGN：真签名要读 Fuji，会让 CI 依赖外部节点。
        env:
          # 与上面单测同一个测试私钥；只是为了让启动检查通过，不做任何外部写操作
          SIGNER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
          SMOKE_PORT: "8791"
        run: bash script/smoke.sh

  frontend:
    name: Frontend (test + tsc + eslint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        # 用 node:test + --experimental-strip-types，不引入 vitest 等新依赖
        # （本机 I/O 慢，装测试框架代价太大）。
        # 主要盯的是 lib/errors.ts 里合约 error selector 有没有写错：
        # 写错是静默故障（匹配不上就走 fallback，用户看到原始报错，没人报 bug）。
        # 测试用 viem 从 ABI 现算 selector，不写死值，合约改了会自动红。
        run: npm test
      - name: Type-check
        working-directory: frontend
        # 仅类型检查（快反馈）：next build 那步也会跑一遍 TypeScript，
        # 但单独留着能让「类型错」和「构建错」在 CI 里分得清，
        # 也省得每次改一行类型都要等完整构建。
        #
        # 耗时说明：这一步慢在**读文件**，不是类型复杂。--extendedDiagnostics
        # 显示 Check time 仅 0.58s，而 I/O Read 达 318s（3051 个文件 / 38 万行
        # .d.ts，源自 wagmi/viem）。本机（沙盒 I/O 约 2MB/s）冷启动要 8 分钟；
        # CI 机器 I/O 正常，快得多。别因为本机慢就去改类型——方向是错的。
        # 本地若有 tsconfig.tsbuildinfo 增量缓存会快到几秒，那是假象：
        # CI 是全新 checkout，没有这个缓存。
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        # eslint-config-next（flat config）此前一直有 2 个
        # react-hooks/set-state-in-effect 报错没人发现，正是因为它没进 CI。
        run: npm run lint
      - name: Build
        working-directory: frontend
        # tsc + eslint 都看不见这个项目的真实构建边界：client/server 组件
        # 划分、`next/font` 取字体、预渲染（4 个静态页）以及 RSC 里的非法
        # import，只有 next build 会在这里报。原来注释写的是「留到 PR 前的
        # 本地 next build 兜底」——那等于把一道自动检查交给人的记性。
        #
        # 空 NEXT_PUBLIC_* 是刻意的：CI 没有 .env，正好覆盖「部署时忘配」
        # 这条真实路径（代码里有归一化回退，构建必须在这种环境下也能过）。
        run: npx next build
